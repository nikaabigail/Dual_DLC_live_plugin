# Прогон питоновских тестов на каждый push и каждый PR.
#
# ЗАЧЕМ ЭТО ЗАВЕДЕНО. В этом проекте почти каждый тест закрывает ошибку, которая
# уже случалась, и несколько раз мутационная проверка показывала, что тест был
# декоративным. При такой цене регрессии полагаться на то, что кто-то вспомнит
# прогнать pytest локально, нельзя.
#
# ЧЕГО ЗДЕСЬ НЕТ. Тесты плагина Open Ephys (C++, gtest) не запускаются: для них
# нужны исходники Open Ephys и JUCE, это отдельная сборка на несколько минут.
# Их порядок описан в docs/BUILD_PLUGIN.md и остаётся ручным.
#
# Данные синтетические, GPU и записи не нужны, прогон около минуты.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Боевое окружение закреплено на 3.10.11. Проверять на других версиях
          # смысла нет: код всё равно поедет только на этой.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/requirements-test.txt

      - name: Установить зависимости
        run: pip install -r python/requirements-test.txt

      - name: Тесты
        run: python -m pytest python/tests -q
